name: Build Mac Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
        default: '1.7.0'
      arch:
        description: 'Architecture to build'
        required: true
        default: 'arm64'
        type: choice
        options: ['arm64', 'x64', 'both']
  push:
    tags: ['v*']

# Allow the workflow's GITHUB_TOKEN to create/attach GitHub Releases
permissions:
  contents: write

env:
  NODE_VERSION: '24.21.0'
  PORTABLE_NODE_VERSION: '24.21.0'
  # FFmpeg static binaries from evermeet (signed, notarized, no dylib deps)

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Decide which architectures to build (handle workflow_dispatch + tag push)
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      matrix:  ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              v="${GITHUB_REF#refs/tags/v}"
            else
              v="1.2.0"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version: $v"

      - name: Resolve arch matrix
        id: matrix
        shell: bash
        run: |
          arch="${{ github.event.inputs.arch }}"
          # NOTE: GitHub's macos-15-intel (Intel) runners are effectively unavailable —
          # the x64 job queues for ~24h then gets cancelled, so it has never
          # produced a pkg. Tag pushes therefore build arm64 only (reliable). To
          # attempt an Intel build when runners are available, dispatch manually
          # with arch=x64 or arch=both.
          if [ "$arch" = "both" ]; then
            echo 'matrix=[{"arch":"arm64","runner":"macos-latest"},{"arch":"x64","runner":"macos-15-intel"}]' >> "$GITHUB_OUTPUT"
          elif [ "$arch" = "x64" ]; then
            echo 'matrix=[{"arch":"x64","runner":"macos-15-intel"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"arch":"arm64","runner":"macos-latest"}]' >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Per-architecture build
  # ────────────────────────────────────────────────────────────────────────────
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -m
          sw_vers
          echo "Building for arch=${{ matrix.arch }} on ${{ matrix.runner }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Validate source versions
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: npm run check:version

      - name: Build React client
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      # ──────────────────────────────────────────────────────────────────────
      # Prepare .app bundle skeleton
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up .app structure
        run: |
          APP="packaging/MediaGrab.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          # Copy launcher + Info.plist that were committed to repo
          cp packaging/MediaGrab.app/Contents/Info.plist  "$APP/Contents/Info.plist" 2>/dev/null || true
          cp packaging/MediaGrab.app/Contents/MacOS/MediaGrab "$APP/Contents/MacOS/MediaGrab" 2>/dev/null || true

      - name: Restore launcher + Info.plist from git (CI checkout overwrote them)
        run: |
          git checkout HEAD -- packaging/MediaGrab.app/Contents/Info.plist packaging/MediaGrab.app/Contents/MacOS/MediaGrab
          chmod +x packaging/MediaGrab.app/Contents/MacOS/MediaGrab

      - name: Install app icon
        run: |
          cp packaging/assets/AppIcon.icns packaging/MediaGrab.app/Contents/Resources/AppIcon.icns
          ls -la packaging/MediaGrab.app/Contents/Resources/AppIcon.icns

      # ──────────────────────────────────────────────────────────────────────
      # Copy app source + install production deps into Resources/app/
      # ──────────────────────────────────────────────────────────────────────
      - name: Copy app source
        run: |
          RES="packaging/MediaGrab.app/Contents/Resources"
          rm -rf "$RES/app"
          mkdir -p "$RES/app"
          cp -R server                  "$RES/app/"
          mkdir -p "$RES/app/client"
          cp -R client/dist             "$RES/app/client/dist"
          cp package.json               "$RES/app/"
          [ -f package-lock.json ] && cp package-lock.json "$RES/app/" || true
          # Companion browser extension + native messaging host (loaded by the
          # "Browser Extension" card in Settings).
          cp -R extension               "$RES/app/extension"
          cp -R native-host             "$RES/app/native-host"

      - name: Install production deps into payload
        working-directory: packaging/MediaGrab.app/Contents/Resources/app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --omit=dev --omit=optional --no-audit --no-fund

      # ──────────────────────────────────────────────────────────────────────
      # Download portable Node.js for the target arch
      # ──────────────────────────────────────────────────────────────────────
      - name: Download portable Node.js
        run: |
          ARCH_TAG="${{ matrix.arch }}"
          # nodejs.org uses "arm64" and "x64"
          URL="https://nodejs.org/dist/v${{ env.PORTABLE_NODE_VERSION }}/node-v${{ env.PORTABLE_NODE_VERSION }}-darwin-${ARCH_TAG}.tar.gz"
          echo "Fetching $URL"
          node scripts/download-asset.mjs "node-darwin-${ARCH_TAG}" node.tar.gz
          mkdir -p node-extract
          tar -xzf node.tar.gz -C node-extract
          RES="packaging/MediaGrab.app/Contents/Resources"
          rm -rf "$RES/node"
          mv "node-extract/node-v${{ env.PORTABLE_NODE_VERSION }}-darwin-${ARCH_TAG}" "$RES/node"
          rm -rf node-extract node.tar.gz
          # Slim down
          rm -rf "$RES/node/share/doc" "$RES/node/share/man" "$RES/node/include" 2>/dev/null || true
          "$RES/node/bin/node" --version

      # ──────────────────────────────────────────────────────────────────────
      # Download yt-dlp_macos (single binary, includes Python)
      # ──────────────────────────────────────────────────────────────────────
      - name: Download yt-dlp
        run: |
          RES="packaging/MediaGrab.app/Contents/Resources"
          mkdir -p "$RES/bin"
          node scripts/download-asset.mjs ytdlp-darwin "$RES/bin/yt-dlp"
          chmod +x "$RES/bin/yt-dlp"
          "$RES/bin/yt-dlp" --version

      # ──────────────────────────────────────────────────────────────────────
      # Download ffmpeg static (per-arch URL)
      # ──────────────────────────────────────────────────────────────────────
      - name: Download ffmpeg (arm64)
        if: matrix.arch == 'arm64'
        run: |
          node scripts/download-asset.mjs ffmpeg-darwin-arm64 ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg-extract
          RES="packaging/MediaGrab.app/Contents/Resources"
          # osxexperts builds put ffmpeg at root of zip
          find ffmpeg-extract -name "ffmpeg" -type f -exec cp {} "$RES/bin/ffmpeg" \;
          chmod +x "$RES/bin/ffmpeg"
          rm -rf ffmpeg-extract ffmpeg.zip
          file "$RES/bin/ffmpeg"
          "$RES/bin/ffmpeg" -version | head -1

      - name: Download ffmpeg (x64)
        if: matrix.arch == 'x64'
        run: |
          node scripts/download-asset.mjs ffmpeg-darwin-x64 ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg-extract
          RES="packaging/MediaGrab.app/Contents/Resources"
          find ffmpeg-extract -name "ffmpeg" -type f -exec cp {} "$RES/bin/ffmpeg" \;
          chmod +x "$RES/bin/ffmpeg"
          rm -rf ffmpeg-extract ffmpeg.zip
          file "$RES/bin/ffmpeg"
          "$RES/bin/ffmpeg" -version | head -1

      - name: Download ffprobe and verify media runtime
        env:
          MEDIAGRAB_REQUIRE_MEDIA_TESTS: '1'
        run: |
          RES="packaging/MediaGrab.app/Contents/Resources"
          node scripts/download-asset.mjs "ffprobe-darwin-${{ matrix.arch }}" ffprobe.zip
          unzip -o ffprobe.zip -d ffprobe-extract
          find ffprobe-extract -name "ffprobe" -type f -exec cp {} "$RES/bin/ffprobe" \;
          chmod +x "$RES/bin/ffprobe"
          node scripts/check-bundle.mjs "$RES"
          export PATH="$PWD/$RES/bin:$PWD/$RES/node/bin:$PATH"
          node --test tests/*.test.js
          npm sbom --omit=dev --sbom-format cyclonedx > "$RES/app-sbom.json"
          npm --prefix client sbom --omit=dev --sbom-format cyclonedx > "$RES/client-sbom.json"

      # ──────────────────────────────────────────────────────────────────────
      # Install Playwright Chromium headless shell into ms-playwright/
      # ──────────────────────────────────────────────────────────────────────
      - name: Install Playwright Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packaging/MediaGrab.app/Contents/Resources/ms-playwright
        run: |
          cd packaging/MediaGrab.app/Contents/Resources/app
          cli="node_modules/playwright/cli.js"
          [ ! -f "$cli" ] && cli="node_modules/playwright-core/cli.js"
          echo "Using $cli"
          node "$cli" --version
          if ! node "$cli" install --only-shell chromium; then
            echo "--only-shell unsupported; installing full chromium"
            node "$cli" install chromium
          fi
          ls -lh "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Browser integration with bundled Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packaging/MediaGrab.app/Contents/Resources/ms-playwright
        run: npm run test:browser

      # ──────────────────────────────────────────────────────────────────────
      # Ad-hoc sign all binaries so they pass Gatekeeper's library validation
      # (For real distribution outside Apple Developer Program, the user still
      # needs to xattr -dr com.apple.quarantine OR "Open Anyway" the .pkg.)
      # ──────────────────────────────────────────────────────────────────────
      - name: Ad-hoc codesign bundled binaries
        run: |
          APP="packaging/MediaGrab.app"
          RES="$APP/Contents/Resources"
          chmod +x "$APP/Contents/MacOS/MediaGrab" "$RES/node/bin/node" "$RES/bin/yt-dlp" "$RES/bin/ffmpeg"
          [ -f "$RES/bin/aria2c" ] && chmod +x "$RES/bin/aria2c" || true
          # Sign individual binaries first (aria2c only if it was bundled)
          for bin in "$RES/node/bin/node" "$RES/bin/yt-dlp" "$RES/bin/ffmpeg" "$RES/bin/ffprobe"; do
            [ -f "$bin" ] && codesign --force --sign - "$bin" 2>&1 | head -2 || true
          done
          # Sign Playwright's dylibs and executables
          find "$RES/ms-playwright" -type f \( -name "*.dylib" -o -name "*.so" -o -perm -u=x \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          # Inventory individual binaries before sealing the app resources.
          node scripts/check-bundle.mjs "$RES"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      # ──────────────────────────────────────────────────────────────────────
      # Bundle size report
      # ──────────────────────────────────────────────────────────────────────
      - name: Bundle size report
        run: |
          APP="packaging/MediaGrab.app"
          echo "─── Bundle contents ───"
          du -sh "$APP/Contents/Resources/"* 2>/dev/null || true
          echo ""
          echo "─── Total app size ───"
          du -sh "$APP"

      # ──────────────────────────────────────────────────────────────────────
      # Build the .pkg installer
      # ──────────────────────────────────────────────────────────────────────
      - name: Build .pkg
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BUNDLE_ID="com.mediagrab.app"
          DIST="packaging/dist"
          BUILD="packaging/build"

          rm -rf "$BUILD" "$DIST"
          mkdir -p "$BUILD/payload/Applications" "$DIST"
          cp -R packaging/MediaGrab.app "$BUILD/payload/Applications/"

          PKG_NAME="MediaGrab-${VERSION}-mac-${ARCH}.pkg"
          # Disable bundle relocation. Without this, pkgbuild marks the app as
          # relocatable, so the installer "relocates" into any existing
          # com.mediagrab.app that Launch Services knows about (e.g. a dev copy)
          # instead of installing to /Applications — the app then never appears.
          pkgbuild --analyze --root "$BUILD/payload" "$BUILD/component.plist"
          /usr/bin/python3 -c "import plistlib,sys; p=sys.argv[1]; c=plistlib.load(open(p,'rb')); [d.update(BundleIsRelocatable=False) for d in c]; plistlib.dump(c, open(p,'wb'))" "$BUILD/component.plist"
          pkgbuild \
            --root "$BUILD/payload" \
            --component-plist "$BUILD/component.plist" \
            --identifier "$BUNDLE_ID" \
            --version "$VERSION" \
            --install-location "/" \
            "$DIST/$PKG_NAME"

          ls -lh "$DIST/$PKG_NAME"

      # ──────────────────────────────────────────────────────────────────────
      # Upload artifact + attach to Release on tag push
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Mac-${{ matrix.arch }}-${{ needs.setup.outputs.version }}
          path: packaging/dist/*.pkg
          if-no-files-found: error
          retention-days: 30

      # A tag may create/update a draft, but publishing requires BOTH platforms.
      - name: Keep published releases immutable on reruns
        id: release_state
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: context.ref.replace('refs/tags/', '')
              });
              return data.draft;
            } catch (error) {
              if (error.status === 404) return true;
              throw error;
            }

      - name: Attach to draft GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_state.outputs.result == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: packaging/dist/*.pkg
          body_path: docs/RELEASE-1.7.0.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
